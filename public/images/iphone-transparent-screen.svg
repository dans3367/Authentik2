<svg width="430" height="860" viewBox="0 0 430 860" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">iPhone mockup with transparent screen</title>
  <desc id="desc">A polished iPhone-style device frame with the display area cut out so content behind the SVG remains visible.</desc>
  <defs>
    <linearGradient id="frameEdge" x1="54" y1="36" x2="379" y2="825" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F6F8FB"/>
      <stop offset="0.2" stop-color="#9EA7B3"/>
      <stop offset="0.48" stop-color="#F9FBFD"/>
      <stop offset="0.76" stop-color="#737D8B"/>
      <stop offset="1" stop-color="#E7EBF0"/>
    </linearGradient>
    <linearGradient id="blackGlass" x1="95" y1="77" x2="336" y2="785" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#303742"/>
      <stop offset="0.36" stop-color="#10141B"/>
      <stop offset="1" stop-color="#06080C"/>
    </linearGradient>
    <linearGradient id="rimLight" x1="76" y1="55" x2="354" y2="808" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.88"/>
      <stop offset="0.18" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.26"/>
    </linearGradient>
    <linearGradient id="buttonMetal" x1="17" y1="198" x2="413" y2="653" gradientUnits="userSpaceOnUse">
