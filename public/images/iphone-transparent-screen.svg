    <path fill-rule="evenodd" clip-rule="evenodd" d="M116 42H314C351.555 42 382 72.4446 382 110V750C382 787.555 351.555 818 314 818H116C78.4446 818 48 787.555 48 750V110C48 72.4446 78.4446 42 116 42ZM116 55C85.6243 55 61 79.6243 61 110V750C61 780.376 85.6243 805 116 805H314C344.376 805 369 780.376 369 750V110C369 79.6243 344.376 55 314 55H116Z" fill="url(#rimLight)" opacity="0.8"/>
